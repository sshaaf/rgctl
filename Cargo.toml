[workspace]
members = [
    ".",
    "rgbuilder-macros",
    "crates/rgbuilder-plugin-api",
    "crates/rgbuilder-plugin-helpers",
    "crates/rgbuilder-config-formats",
    "crates/rgbuilder-lang-runtime",
    "crates/rgbuilder-registry",
    "crates/rgbuilder-error",
    "crates/rgbuilder-graph",
    "crates/rgbuilder-extraction",
    "crates/rgbuilder-pipeline",
    "crates/rgbuilder-analysis",
    "crates/rgbuilder-gql",
    "crates/rgbuilder-export",
    "crates/rgbuilder-dashboard",
    "crates/rgbuilder-wasm",
    "crates/rgbuilder-security",
    "crates/rgbuilder-project-config",
    "crates/rgbuilder-incremental",
    "crates/rgbuilder-semantic",
    "crates/rgbuilder-rules",
    "crates/rgbuilder-core",
    "crates/rgbuilder-service",
    "crates/rgbuilder-mcp",
    "crates/rgbuilder-lang-go",
    "crates/rgbuilder-lang-java",
    "crates/rgbuilder-lang-javascript",
    "crates/rgbuilder-lang-python",
    "crates/rgbuilder-lang-rust",
    "crates/rgbuilder-lang-typescript",
    "crates/rgbuilder-lang-csharp",
    "crates/rgbuilder-lang-c",
    "crates/rgbuilder-lang-cpp",
    "crates/rgbuilder-lang-markdown",
    "crates/rgbuilder-languages",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
rgbuilder-plugin-api = { path = "crates/rgbuilder-plugin-api", version = "0.4.6" }
rgbuilder-plugin-helpers = { path = "crates/rgbuilder-plugin-helpers", version = "0.4.6" }
rgbuilder-config-formats = { path = "crates/rgbuilder-config-formats", version = "0.4.6" }
rgbuilder-lang-runtime = { path = "crates/rgbuilder-lang-runtime", version = "0.4.6" }
rgbuilder-registry = { path = "crates/rgbuilder-registry", version = "0.4.6" }
rgbuilder-error = { path = "crates/rgbuilder-error", version = "0.4.6" }
rgbuilder-graph = { path = "crates/rgbuilder-graph", version = "0.4.6" }
rgbuilder-extraction = { path = "crates/rgbuilder-extraction", version = "0.4.6" }
rgbuilder-pipeline = { path = "crates/rgbuilder-pipeline", version = "0.4.6" }
rgbuilder-analysis = { path = "crates/rgbuilder-analysis", version = "0.4.6", default-features = false }
rgbuilder-gql = { path = "crates/rgbuilder-gql", version = "0.4.6" }
rgbuilder-export = { path = "crates/rgbuilder-export", version = "0.4.6" }
rgbuilder-dashboard = { path = "crates/rgbuilder-dashboard", version = "0.4.6" }
rgbuilder-wasm = { path = "crates/rgbuilder-wasm", version = "0.4.6" }
rgbuilder-security = { path = "crates/rgbuilder-security", version = "0.4.6" }
rgbuilder-project-config = { path = "crates/rgbuilder-project-config", version = "0.4.6" }
rgbuilder-incremental = { path = "crates/rgbuilder-incremental", version = "0.4.6" }
rgbuilder-semantic = { path = "crates/rgbuilder-semantic", version = "0.4.6" }
rgbuilder-rules = { path = "crates/rgbuilder-rules", version = "0.4.6" }
rgbuilder-core = { path = "crates/rgbuilder-core", version = "0.4.6" }
rgbuilder-service = { path = "crates/rgbuilder-service", version = "0.4.6" }
rgbuilder-mcp = { path = "crates/rgbuilder-mcp", version = "0.4.6" }
tempfile = "3"
zstd = "0.13"
rayon = "1.7"
rgbuilder-lang-go = { path = "crates/rgbuilder-lang-go", version = "0.4.6" }
rgbuilder-lang-java = { path = "crates/rgbuilder-lang-java", version = "0.4.6" }
rgbuilder-lang-javascript = { path = "crates/rgbuilder-lang-javascript", version = "0.4.6" }
rgbuilder-lang-python = { path = "crates/rgbuilder-lang-python", version = "0.4.6" }
rgbuilder-lang-rust = { path = "crates/rgbuilder-lang-rust", version = "0.4.6" }
rgbuilder-lang-typescript = { path = "crates/rgbuilder-lang-typescript", version = "0.4.6" }
rgbuilder-lang-csharp = { path = "crates/rgbuilder-lang-csharp", version = "0.4.6" }
rgbuilder-lang-c = { path = "crates/rgbuilder-lang-c", version = "0.4.6" }
rgbuilder-lang-cpp = { path = "crates/rgbuilder-lang-cpp", version = "0.4.6" }
rgbuilder-lang-markdown = { path = "crates/rgbuilder-lang-markdown", version = "0.4.6" }
rgbuilder-languages = { path = "crates/rgbuilder-languages", version = "0.4.6" }
tree-sitter = "0.25"

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"
unexpected_cfgs = "warn"

[workspace.lints.clippy]
# Correctness lints (deny - these are likely bugs)
correctness = { level = "deny", priority = -1 }

# Suspicious patterns (warn - likely bugs)
suspicious = { level = "warn", priority = -1 }

# Style and complexity (warn - code quality)
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }

# Performance (warn - potential optimizations)
perf = { level = "warn", priority = -1 }

# Specific important lints
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
unwrap_used = "warn"
expect_used = "warn"

[package]
name = "rgbuilder"
version = "0.4.6"
edition.workspace = true
rust-version.workspace = true
authors = ["rgBuilder Contributors"]
description = "A Code knowledge graph system"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sshaaf/rgBuilder"
readme = "README.md"
keywords = ["code-analysis", "graph", "ai", "knowledge-graph"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
# Workspace crates
rgbuilder-core = { workspace = true }
rgbuilder-service = { workspace = true }
rgbuilder-mcp = { workspace = true }
rgbuilder-plugin-api = { workspace = true }
rgbuilder-plugin-helpers = { workspace = true }
rgbuilder-config-formats = { workspace = true }
rgbuilder-lang-runtime = { workspace = true }
rgbuilder-registry = { workspace = true }
rgbuilder-error = { workspace = true }
rgbuilder-graph = { workspace = true }
rgbuilder-extraction = { workspace = true }
rgbuilder-pipeline = { workspace = true }
rgbuilder-analysis = { workspace = true }
rgbuilder-gql = { workspace = true }
rgbuilder-export = { workspace = true }
rgbuilder-dashboard = { workspace = true }
rgbuilder-security = { workspace = true }
rgbuilder-project-config = { workspace = true }
rgbuilder-incremental = { workspace = true }
rgbuilder-semantic = { workspace = true }
rgbuilder-rules = { workspace = true }
rgbuilder-languages = { workspace = true }

rgbuilder-macros = { path = "rgbuilder-macros", optional = true }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
quick-xml = "0.31"
indradb-lib = "4.0"
petgraph = "0.6"
pathfinding = "4.0"
rayon = "1.7"
tokio = { version = "1", features = ["full"] }
crossbeam = "0.8"
regex = "1"
aho-corasick = "1"
fancy-regex = "0.11"
unicode-normalization = "0.1"
strsim = "0.11"
clap = { version = "4", features = ["derive"] }
comfy-table = "7"
indicatif = "0.17"
console = "0.15"
handlebars = "4"
blake3 = "1"
xxhash-rust = "0.8"
anyhow = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sysinfo = "0.30"
pulldown-cmark = "0.9"
bincode = "1.3"
ignore = "0.4"
include_dir = "0.7"
axum = "0.8"
tower-http = { version = "0.6", features = ["fs"] }
tower = { version = "0.5", features = ["util"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"
tempfile = "3"
pretty_assertions = "1"
insta = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
rgbuilder-graph = { workspace = true }
rgbuilder-dashboard = { workspace = true }
rgbuilder-lang-go = { workspace = true }
rgbuilder-lang-csharp = { workspace = true }
rgbuilder-lang-c = { workspace = true }
rgbuilder-lang-cpp = { workspace = true }
rgbuilder-lang-javascript = { workspace = true }
rgbuilder-lang-typescript = { workspace = true }
rgbuilder-lang-rust = { workspace = true }

[features]
default = ["semantic-onnx"]
proc-macros = ["rgbuilder-macros"]
semantic-onnx = ["rgbuilder-analysis/semantic-onnx"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
inherits = "release"
debug = false
strip = false

