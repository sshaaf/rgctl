[workspace]
members = [
    ".",
    "rgctl-macros",
    "crates/rgctl-plugin-api",
    "crates/rgctl-plugin-helpers",
    "crates/rgctl-config-formats",
    "crates/rgctl-lang-runtime",
    "crates/rgctl-registry",
    "crates/rgctl-error",
    "crates/rgctl-graph",
    "crates/rgctl-extraction",
    "crates/rgctl-pipeline",
    "crates/rgctl-analysis",
    "crates/rgctl-gql",
    "crates/rgctl-export",
    "crates/rgctl-dashboard",
    "crates/rgctl-wasm",
    "crates/rgctl-security",
    "crates/rgctl-project-config",
    "crates/rgctl-incremental",
    "crates/rgctl-semantic",
    "crates/rgctl-rules",
    "crates/rgctl-kantra",
    "crates/rgctl-core",
    "crates/rgctl-service",
    "crates/rgctl-lang-go",
    "crates/rgctl-lang-java",
    "crates/rgctl-lang-javascript",
    "crates/rgctl-lang-python",
    "crates/rgctl-lang-rust",
    "crates/rgctl-lang-typescript",
    "crates/rgctl-lang-csharp",
    "crates/rgctl-lang-c",
    "crates/rgctl-lang-cpp",
    "crates/rgctl-lang-markdown",
    "crates/rgctl-languages",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
rgctl-plugin-api = { path = "crates/rgctl-plugin-api", version = "0.4.9" }
rgctl-plugin-helpers = { path = "crates/rgctl-plugin-helpers", version = "0.4.9" }
rgctl-config-formats = { path = "crates/rgctl-config-formats", version = "0.4.9" }
rgctl-lang-runtime = { path = "crates/rgctl-lang-runtime", version = "0.4.9" }
rgctl-registry = { path = "crates/rgctl-registry", version = "0.4.9" }
rgctl-error = { path = "crates/rgctl-error", version = "0.4.9" }
rgctl-graph = { path = "crates/rgctl-graph", version = "0.4.9" }
rgctl-extraction = { path = "crates/rgctl-extraction", version = "0.4.9" }
rgctl-pipeline = { path = "crates/rgctl-pipeline", version = "0.4.9" }
rgctl-analysis = { path = "crates/rgctl-analysis", version = "0.4.9", default-features = false }
rgctl-gql = { path = "crates/rgctl-gql", version = "0.4.9" }
rgctl-export = { path = "crates/rgctl-export", version = "0.4.9" }
rgctl-dashboard = { path = "crates/rgctl-dashboard", version = "0.4.9" }
rgctl-wasm = { path = "crates/rgctl-wasm", version = "0.4.9" }
rgctl-security = { path = "crates/rgctl-security", version = "0.4.9" }
rgctl-project-config = { path = "crates/rgctl-project-config", version = "0.4.9" }
rgctl-incremental = { path = "crates/rgctl-incremental", version = "0.4.9" }
rgctl-semantic = { path = "crates/rgctl-semantic", version = "0.4.9" }
rgctl-rules = { path = "crates/rgctl-rules", version = "0.4.9" }
rgctl-kantra = { path = "crates/rgctl-kantra", version = "0.4.9" }
rgctl-core = { path = "crates/rgctl-core", version = "0.4.9" }
rgctl-service = { path = "crates/rgctl-service", version = "0.4.9" }
tempfile = "3"
zstd = "0.13"
rayon = "1.7"
rgctl-lang-go = { path = "crates/rgctl-lang-go", version = "0.4.9" }
rgctl-lang-java = { path = "crates/rgctl-lang-java", version = "0.4.9" }
rgctl-lang-javascript = { path = "crates/rgctl-lang-javascript", version = "0.4.9" }
rgctl-lang-python = { path = "crates/rgctl-lang-python", version = "0.4.9" }
rgctl-lang-rust = { path = "crates/rgctl-lang-rust", version = "0.4.9" }
rgctl-lang-typescript = { path = "crates/rgctl-lang-typescript", version = "0.4.9" }
rgctl-lang-csharp = { path = "crates/rgctl-lang-csharp", version = "0.4.9" }
rgctl-lang-c = { path = "crates/rgctl-lang-c", version = "0.4.9" }
rgctl-lang-cpp = { path = "crates/rgctl-lang-cpp", version = "0.4.9" }
rgctl-lang-markdown = { path = "crates/rgctl-lang-markdown", version = "0.4.9" }
rgctl-languages = { path = "crates/rgctl-languages", version = "0.4.9" }
tree-sitter = "0.25"

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"
unexpected_cfgs = "warn"

[workspace.lints.clippy]
# Correctness lints (deny - these are likely bugs)
correctness = { level = "deny", priority = -1 }

# Suspicious patterns (warn - likely bugs)
suspicious = { level = "warn", priority = -1 }

# Style and complexity (warn - code quality)
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }

# Performance (warn - potential optimizations)
perf = { level = "warn", priority = -1 }

# Specific important lints
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
unwrap_used = "warn"
expect_used = "warn"

[package]
name = "rgctl"
version = "0.4.9"
edition.workspace = true
rust-version.workspace = true
authors = ["rgctl Contributors"]
description = "A Code knowledge graph system"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sshaaf/rgctl"
readme = "README.md"
keywords = ["code-analysis", "graph", "ai", "knowledge-graph"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
# Workspace crates
rgctl-core = { workspace = true }
rgctl-service = { workspace = true }
rgctl-plugin-api = { workspace = true }
rgctl-plugin-helpers = { workspace = true }
rgctl-config-formats = { workspace = true }
rgctl-lang-runtime = { workspace = true }
rgctl-registry = { workspace = true }
rgctl-error = { workspace = true }
rgctl-graph = { workspace = true }
rgctl-extraction = { workspace = true }
rgctl-pipeline = { workspace = true }
rgctl-analysis = { workspace = true }
rgctl-gql = { workspace = true }
rgctl-export = { workspace = true }
rgctl-dashboard = { workspace = true }
rgctl-security = { workspace = true }
rgctl-project-config = { workspace = true }
rgctl-incremental = { workspace = true }
rgctl-semantic = { workspace = true }
rgctl-rules = { workspace = true }
rgctl-kantra = { workspace = true }
rgctl-languages = { workspace = true }

rgctl-macros = { path = "rgctl-macros", optional = true }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
quick-xml = "0.31"
indradb-lib = "4.0"
petgraph = "0.6"
pathfinding = "4.0"
rayon = "1.7"
tokio = { version = "1", features = ["full"] }
crossbeam = "0.8"
regex = "1"
aho-corasick = "1"
fancy-regex = "0.11"
unicode-normalization = "0.1"
strsim = "0.11"
clap = { version = "4", features = ["derive"] }
comfy-table = "7"
indicatif = "0.17"
console = "0.15"
handlebars = "4"
blake3 = "1"
xxhash-rust = "0.8"
anyhow = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sysinfo = "0.30"
pulldown-cmark = "0.9"
bincode = "1.3"
ignore = "0.4"
include_dir = "0.7"
axum = "0.8"
tower-http = { version = "0.6", features = ["fs"] }
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"
tempfile = "3"
pretty_assertions = "1"
insta = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
rgctl-graph = { workspace = true }
rgctl-dashboard = { workspace = true }
rgctl-lang-go = { workspace = true }
rgctl-lang-csharp = { workspace = true }
rgctl-lang-c = { workspace = true }
rgctl-lang-cpp = { workspace = true }
rgctl-lang-javascript = { workspace = true }
rgctl-lang-typescript = { workspace = true }
rgctl-lang-rust = { workspace = true }

[features]
default = ["semantic-onnx"]
proc-macros = ["rgctl-macros"]
semantic-onnx = ["rgctl-analysis/semantic-onnx"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
inherits = "release"
debug = false
strip = false

