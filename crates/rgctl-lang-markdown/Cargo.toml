[package]
name = "rgctl-lang-markdown"
version = "0.4.8"
edition.workspace = true
rust-version.workspace = true
description = "rgctl language plugin: markdown (context / documentation graph)"
license = "MIT OR Apache-2.0"

[dependencies]
rgctl-plugin-api = { workspace = true }
rgctl-registry = { workspace = true }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
tree-sitter = { workspace = true }
tree-sitter-md = { version = "0.5.3", default-features = false }
blake3 = "1"

[dev-dependencies]
pretty_assertions = "1"
