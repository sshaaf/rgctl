[package]
name = "rgctl-kantra"
version = "0.4.8"
edition.workspace = true
rust-version.workspace = true
description = "Native Konveyor Kantra rule evaluator for rgctl"
license = "MIT OR Apache-2.0"
build = "build.rs"

[features]
default = ["kantra-embedded-java"]
kantra-embedded-java = []

[dependencies]
rgctl-error = { path = "../rgctl-error" }
rgctl-graph = { path = "../rgctl-graph" }
glob = "0.3"
rayon = { workspace = true }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
bincode = "1.3"
thiserror = "2"
uuid = { version = "1", features = ["v4", "v5", "serde"] }

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
bincode = "1.3"

[dev-dependencies]
tempfile = "3"
