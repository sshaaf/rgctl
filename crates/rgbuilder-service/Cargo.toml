[package]
name = "rgbuilder-service"
version = "0.4.6"
edition.workspace = true
rust-version.workspace = true
description = "Shared command execution for rgBuilder CLI, HTTP, and MCP"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
rgbuilder-analysis = { workspace = true }
rgbuilder-error = { workspace = true }
rgbuilder-gql = { workspace = true }
rgbuilder-graph = { workspace = true }
rgbuilder-rules = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
