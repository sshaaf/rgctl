[package]
name = "rgctl-project-config"
version = "0.4.6"
edition.workspace = true
rust-version.workspace = true
description = "Project configuration analysis for rgctl"
license = "MIT OR Apache-2.0"

[dependencies]
rgctl-error = { path = "../rgctl-error" }
rgctl-extraction = { path = "../rgctl-extraction" }
rgctl-graph = { path = "../rgctl-graph" }
rgctl-plugin-api = { path = "../rgctl-plugin-api" }
rgctl-registry = { path = "../rgctl-registry" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"

[dev-dependencies]
tempfile = { workspace = true }
