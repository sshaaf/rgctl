[package]
name = "rgctl-agent-pack-codegen"
version = "0.4.16"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
walkdir = "2"

[[bin]]
name = "rgctl-agent-pack-codegen"
path = "src/main.rs"

[lib]
name = "rgctl_agent_pack_codegen"
path = "src/lib.rs"
