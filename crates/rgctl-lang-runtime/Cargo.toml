[package]
name = "rgctl-lang-runtime"
version = "0.4.11"
edition.workspace = true
rust-version.workspace = true
description = "Generic tree-sitter and regex language plugins for rgctl"
license = "MIT OR Apache-2.0"

[dependencies]
rgctl-plugin-api = { path = "../rgctl-plugin-api" }
rgctl-plugin-helpers = { path = "../rgctl-plugin-helpers" }
regex = "1"
serde_json = "1"
tree-sitter = "0.25"

[dev-dependencies]
tree-sitter-c = "0.24"
