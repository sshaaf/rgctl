[package]
name = "rgctl-registry"
version = "0.4.10"
edition.workspace = true
rust-version.workspace = true
description = "Language plugin registry for rgctl"
license = "MIT OR Apache-2.0"

[dependencies]
rgctl-config-formats = { path = "../rgctl-config-formats" }
rgctl-error = { path = "../rgctl-error" }
rgctl-graph = { path = "../rgctl-graph" }
rgctl-plugin-api = { path = "../rgctl-plugin-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = { workspace = true }
