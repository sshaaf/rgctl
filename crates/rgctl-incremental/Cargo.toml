[package]
name = "rgctl-incremental"
version = "0.4.7"
edition.workspace = true
rust-version.workspace = true
description = "Incremental graph updates for rgctl"
license = "MIT OR Apache-2.0"

[dependencies]
rgctl-analysis = { path = "../rgctl-analysis" }
rgctl-error = { path = "../rgctl-error" }
rgctl-extraction = { path = "../rgctl-extraction" }
rgctl-graph = { path = "../rgctl-graph" }
rgctl-pipeline = { path = "../rgctl-pipeline" }
rgctl-plugin-api = { path = "../rgctl-plugin-api" }
rgctl-project-config = { path = "../rgctl-project-config" }
rgctl-registry = { path = "../rgctl-registry" }
blake3 = "1"
indicatif = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = { workspace = true }
rgctl-languages = { workspace = true }
