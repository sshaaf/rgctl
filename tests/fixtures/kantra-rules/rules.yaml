- ruleID: filecontent-go-hkdf
  description: Detect hkdf import in Go source
  category: mandatory
  message: Replace golang.org/x/crypto/hkdf with crypto/hkdf
  labels:
    - konveyor.io/target=quarkus
  when:
    builtin.filecontent:
      pattern: golang\.org/x/crypto/hkdf
      filePattern: "**/*.go"

- ruleID: file-glob-dockerfile
  description: Match Dockerfile paths
  category: optional
  message: Dockerfile present
  when:
    builtin.file:
      pattern: "**/Dockerfile"

- ruleID: go-import-gorm
  description: Detect gorm import
  category: mandatory
  message: GORM dependency found
  when:
    go.referenced:
      pattern: gorm\.io/gorm

- ruleID: java-import-spring
  description: Detect Spring stereotype imports
  category: mandatory
  message: Spring framework import found
  when:
    java.referenced:
      pattern: org\.springframework\.stereotype
      location: IMPORT

- ruleID: composite-and-demo
  description: And of filecontent conditions
  category: optional
  message: both patterns found
  when:
    and:
      - builtin.filecontent:
          pattern: UNIQUE_COMPOSITE_A
      - builtin.filecontent:
          pattern: UNIQUE_COMPOSITE_B

- ruleID: unsupported-dependency
  description: Should be skipped
  category: mandatory
  message: n/a
  when:
    java.dependency:
      name: foo
